name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check that server.json matches the published npm package
        run: |
          set -euo pipefail
          package_version="$(jq -r .version package.json)"
          server_version="$(jq -r .version server.json)"
          server_package_version="$(jq -r '.packages[0].version' server.json)"
          if [ "$server_version" != "$package_version" ] || [ "$server_package_version" != "$package_version" ]; then
            echo "server.json versions ($server_version, $server_package_version) must equal package.json ($package_version)" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $package_version" >&2
            exit 1
          fi
          if [ "$(jq -r .mcpName package.json)" != "$(jq -r .name server.json)" ]; then
            echo "package.json mcpName must equal server.json name" >&2
            exit 1
          fi
          published="$(npm view "shotomatic@$package_version" version 2>/dev/null || true)"
          if [ "$published" != "$package_version" ]; then
            echo "shotomatic@$package_version is not on npm yet; run npm publish first" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
